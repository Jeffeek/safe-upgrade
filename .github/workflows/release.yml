name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    name: Publish GitHub release
    needs: [ci]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1

      - name: Build assets
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          mkdir -p dist
          pkg="safe-upgrade-${TAG}"
          mkdir "dist/${pkg}"
          cp safe-upgrade.sh README.md LICENSE CHANGELOG.md "dist/${pkg}/"
          cp -r tests "dist/${pkg}/tests"
          tar -C dist -czf "dist/${pkg}.tar.gz" "${pkg}"
          cp safe-upgrade.sh dist/safe-upgrade.sh
          (cd dist && sha256sum safe-upgrade.sh "${pkg}.tar.gz" > SHA256SUMS && cat SHA256SUMS)

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # 4.2.2
        with:
          subject-path: |
            dist/safe-upgrade.sh
            dist/safe-upgrade-${{ github.ref_name }}.tar.gz

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          flags=(--generate-notes --title "$TAG")
          case "$TAG" in v0.*|*-*) flags+=(--prerelease) ;; esac
          gh release create "$TAG" \
            dist/safe-upgrade.sh "dist/safe-upgrade-${TAG}.tar.gz" dist/SHA256SUMS \
            "${flags[@]}"
