name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    name: Publish GitHub release
    needs: [ci]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build assets
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          mkdir -p dist
          pkg="safe-upgrade-${TAG}"
          mkdir "dist/${pkg}"
          cp safe-upgrade.sh README.md LICENSE CHANGELOG.md "dist/${pkg}/"
          cp -r tests "dist/${pkg}/tests"
          tar -C dist -czf "dist/${pkg}.tar.gz" "${pkg}"
          cp safe-upgrade.sh dist/safe-upgrade.sh
          (cd dist && sha256sum safe-upgrade.sh "${pkg}.tar.gz" > SHA256SUMS && cat SHA256SUMS)

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          flags=(--generate-notes --title "$TAG")
          case "$TAG" in v0.*|*-*) flags+=(--prerelease) ;; esac
          gh release create "$TAG" \
            dist/safe-upgrade.sh "dist/safe-upgrade-${TAG}.tar.gz" dist/SHA256SUMS \
            "${flags[@]}"
