name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:          # reused by release.yml so a release always passes CI first
  schedule:
    - cron: "17 4 * * 1"  # weekly: catches new distro point releases breaking the script

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1

      - name: File hygiene (shebang, line endings)
        run: |
          set -eu
          first=$(head -n 1 safe-upgrade.sh)
          [ "$first" = "#!/usr/bin/env bash" ] || { echo "::error file=safe-upgrade.sh,line=1::shebang must be the first line (found: $first)"; exit 1; }
          if grep -rIl $'\r' --include='*.sh' --include='*.bash' --include='*.bats' --include='*.yml' --include='*.md' --include='Makefile' . ; then
            echo "::error::CRLF line endings found in the files listed above"; exit 1
          fi

      - name: Syntax check
        run: bash -n safe-upgrade.sh && bash -n tests/integration/container-test.sh

      - name: ShellCheck
        # ShellCheck is preinstalled on GitHub's Ubuntu runners.
        run: |
          shellcheck --version
          shellcheck --severity=warning safe-upgrade.sh tests/integration/container-test.sh

  unit-tests:
    name: Unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # amd64 and arm64 (Raspberry Pi class) on current and previous LTS.
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-24.04-arm, ubuntu-26.04, ubuntu-26.04-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1

      - name: Install bats-core (pinned)
        run: |
          git clone --depth 1 --branch v1.10.0 https://github.com/bats-core/bats-core.git "$RUNNER_TEMP/bats-core"
          sudo "$RUNNER_TEMP/bats-core/install.sh" /usr/local
          bats --version

      - name: Run tests as a normal user
        run: bats --print-output-on-failure tests/unit.bats tests/cli.bats

      - name: Run tests as root (covers the root-only branches)
        run: sudo "$(command -v bats)" --print-output-on-failure tests/unit.bats tests/cli.bats

  integration:
    name: Integration (${{ matrix.image }} on ${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    needs: [lint]
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        image: ["debian:12", "debian:13", "ubuntu:22.04", "ubuntu:24.04", "ubuntu:26.04"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1

      - name: Run end-to-end tests in a disposable container
        # Phase A uses the real apt-get; phase B uses a scripted fake (see
        # tests/integration/container-test.sh). The container is thrown away.
        run: |
          docker run --rm \
            -e DEBIAN_FRONTEND=noninteractive \
            -v "$PWD:/src:ro" \
            "${{ matrix.image }}" bash -c '
              set -eu
              printf "#!/bin/sh\nexit 101\n" > /usr/sbin/policy-rc.d
              chmod +x /usr/sbin/policy-rc.d
              apt-get update -qq
              apt-get install -y -qq ca-certificates util-linux >/dev/null
              bash /src/tests/integration/container-test.sh
            '

  systemd:
    name: Real systemd (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [lint]
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-24.04-arm, ubuntu-26.04, ubuntu-26.04-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
      - name: systemd state
        run: |
          systemctl --version | head -n1
          systemctl is-system-running || true
      - name: Run real-systemd tests
        run: sudo env I_UNDERSTAND_THIS_MODIFIES_THE_SYSTEM=yes bash tests/integration/systemd-test.sh

  # Real Raspberry Pi OS userland (arm64): genuine apt/dpkg/apt-mark and the
  # Pi /boot + /lib/modules package layout, which plain Debian/Ubuntu images do
  # not reproduce. LIMITATION: arm-runner-action uses qemu-user emulation and
  # shares the host kernel, so `uname -r` is the runner's, not a +rpt-rpi-v8
  # string. The Pi reboot-detection path is therefore NOT exercised here (it is
  # covered by the FAKE_KERNEL unit tests); this job covers the apt/dpkg flow on
  # a real Pi OS root filesystem. Offline phase only (no network inside qemu).
  #
  # Runs on an amd64 host: arm-runner-action EMULATES aarch64 via qemu and
  # re-registers the aarch64 binfmt handler, which corrupts a native arm64
  # runner's own binaries. It must run on x86_64, and ubuntu-22.04 is the most
  # stable host for the action's qemu/binfmt setup (newer hosts have seen
  # emulation segfaults during guest package installs; see arm-runner-action
  # issues #114, #120, #132).
  raspios:
    name: Raspberry Pi OS userland (arm64, qemu)
    runs-on: ubuntu-22.04
    needs: [lint]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
      - name: Run offline integration on real Pi OS userland
        uses: pguyot/arm-runner-action@e1773de1ed6eb61848f5693de824d836f0b0ea25 # v2.6.5
        with:
          base_image: raspios_lite_arm64:latest
          cpu: cortex-a53
          # Pi OS Lite ships only ~300MB free; grow the image so the real
          # MIN_FREE_MB=1024 space check passes (Phase B installs nothing).
          image_additional_mb: 2048
          # Skip the final filesystem shrink: it runs e2fsck on the host, whose
          # e2fsprogs is too old for the newer Pi OS filesystem features.
          optimize_image: false
          commands: |
            set -eu
            # util-linux (findmnt/mountpoint) and flock are part of the Pi OS
            # Lite base image, so no in-guest apt install is needed (and the
            # guest has no network under qemu anyway).
            SKIP_REAL_APT=1 I_UNDERSTAND_THIS_MODIFIES_THE_SYSTEM=yes \
              bash tests/integration/container-test.sh

  # A single required check for branch protection.
  ci-ok:
    name: CI passed
    runs-on: ubuntu-24.04
    if: always()
    needs: [lint, unit-tests, integration, systemd, raspios]
    steps:
      - name: Verify every job succeeded
        run: |
          echo "lint=${{ needs.lint.result }} unit=${{ needs.unit-tests.result }} integration=${{ needs.integration.result }} systemd=${{ needs.systemd.result }} raspios=${{ needs.raspios.result }}"
          [ "${{ needs.lint.result }}" = success ] &&
          [ "${{ needs.unit-tests.result }}" = success ] &&
          [ "${{ needs.integration.result }}" = success ] &&
          [ "${{ needs.systemd.result }}" = success ] &&
          [ "${{ needs.raspios.result }}" = success ]
